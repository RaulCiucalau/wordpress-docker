services:
  db:
    image: bitnami/mariadb:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - db_data:/bitnami/mariadb
    networks:
      - wordpress_net

  wordpress:
    image: bitnami/wordpress:latest
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${WORDPRESS_PORT:-8080}:8080"
    networks:
      - wordpress_net

volumes:
  db_data:

networks:
  wordpress_net:
    driver: bridge